name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pugu
          POSTGRES_PASSWORD: pugu
          POSTGRES_DB: pugu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pugu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pugu:pugu@localhost:5432/pugu_test
      JWT_SECRET: ci-secret-min-32-chars-please-replace-in-prod
      CSRF_SECRET: ci-csrf-secret-min-32-chars-please-replace
      COOKIE_NAME: pugu_session
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Patch Prisma Client for CommonJS compat
        run: bun scripts/patch-prisma.js

      - name: Build Monorepo Workspace
        run: bun run build

      - name: Run Tests
        run: bun run test
