name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Vue app imports the external `components/huuk` kit (outside this repo),
  # so frontend typecheck/build/tests run where that kit exists via `just verify`.
  # CI verifies the Rust server + ts-rs contract drift end-to-end via `just verify-ci`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install just
        uses: extractions/setup-just@v2

      # Single entry point (fmt, clippy -D warnings, cargo test, ts-rs git diff check)
      - name: Run CI verification
        run: just verify-ci
