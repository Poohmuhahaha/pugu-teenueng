name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos_test
      JWT_SECRET: ci-secret-min-32-chars-please-replace-in-prod
      CSRF_SECRET: ci-csrf-secret-min-32-chars-please-replace
      COOKIE_NAME: lifeos_session
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate Prisma Client
        run: deno run -A npm:prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Patch Prisma Client for CommonJS compat
        run: deno run -A scripts/patch-prisma.js

      - name: Build Monorepo Workspace
        run: deno task build

      - name: Run Tests
        run: deno task test
