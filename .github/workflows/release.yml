name: Release Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Only the API image is built here: the web image needs the external
  # `components/huuk` kit as an additional build context, which GitHub
  # runners do not have. Build it locally with `docker compose build web`.
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pugu-api:latest
            ghcr.io/${{ github.repository_owner }}/pugu-api:${{ github.event.release.tag_name || github.sha }}
