<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fcf6eb" />

    <!-- Primary SEO -->
    <title>QuestPage — Your personal AI secretary · Open-source, self-host or cloud</title>
    <meta name="description" content="QuestPage is the open-source RPG tavern-style personal AI secretary. Knowledge graph, spellbook editor, quest board views, REST API, and zero-knowledge sync. Self-host with Docker, or use QuestPage Cloud." />
    <meta name="keywords" content="open source notion alternative, rpg tavern productivity, self-hosted productivity, knowledge graph, spellbook editor, local-first, e2ee sync, quest page, questpage" />
    <meta name="author" content="QuestPage" />
    <link rel="canonical" href="https://questpage.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuestPage" />
    <meta property="og:url" content="https://questpage.app/" />
    <meta property="og:title" content="QuestPage — Open-source RPG tavern-style personal AI secretary" />
    <meta property="og:description" content="Knowledge graph + spellbook editor + REST API. Self-host or cloud. Your daily life as an RPG quest board." />
    <meta property="og:image" content="https://questpage.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="th_TH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuestPage — Open-source RPG tavern-style personal AI secretary" />
    <meta name="twitter:description" content="Knowledge graph + spellbook editor + REST API. Self-host or cloud." />
    <meta name="twitter:image" content="https://questpage.app/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- JSON-LD: Organization + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://questpage.app/#org",
          "name": "QuestPage",
          "url": "https://questpage.app/",
          "logo": "https://questpage.app/logo.png",
          "sameAs": [
            "https://github.com/Poohmuhahaha/questpage"
          ]
        },
        {
          "@type": "SoftwareApplication",
          "name": "QuestPage",
          "url": "https://questpage.app/",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Web, Linux, macOS, Windows (Docker)",
          "description": "Open-source RPG tavern-style personal AI secretary. Knowledge graph, spellbook editor, REST API, zero-knowledge sync.",
          "publisher": { "@id": "https://questpage.app/#org" },
          "offers": [
            { "@type": "Offer", "name": "Free",         "price": "0",    "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Personal Pro", "price": "5.99", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Studio",       "price": "29",   "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Self-host",    "price": "0",    "priceCurrency": "USD" }
          ],
          "license": "https://www.gnu.org/licenses/agpl-3.0.html"
        }
      ]
    }
    </script>

    %sveltekit.head%
  </head>
  <body>
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
