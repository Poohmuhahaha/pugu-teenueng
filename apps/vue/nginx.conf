server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy — the Vue app calls same-origin /api/*.
  location /api/ {
    proxy_pass http://api:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for the Vue Router (history mode).
  # index.html must never be cached — hashed assets handle versioning.
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed bundles are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
