services:
  api:
    build:
      context: ./server
    container_name: pugu-api
    environment:
      BIND_ADDR: 0.0.0.0
      PORT: 8788
      SEED: '1'
      DATA_FILE: /data/pugu.json
    volumes:
      - pugu_data:/data
    ports:
      - '${API_PORT:-8788}:8788'

  web:
    build:
      context: .
      dockerfile: apps/vue/Dockerfile
      additional_contexts:
        huuk: /home/aslpooht/PROJECT/_TEENUENG-COMPANY/components/huuk
    container_name: pugu-web
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3001}:80'

volumes:
  pugu_data:
