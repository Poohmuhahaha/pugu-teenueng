version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: lifeos-db
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: lifeos
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lifeos_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lifeos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD:-changeme}@db:5432/lifeos
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CSRF_SECRET: ${CSRF_SECRET:?set in .env}
      COOKIE_NAME: life_session
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifeos-web
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: http://api:3000
      NODE_ENV: production
      PORT: 3001
    ports:
      - '${WEB_PORT:-3001}:3001'

  minio:
    image: minio/minio:latest
    container_name: lifeos-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lifeos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - lifeos_minio:/data
    profiles: [files]

volumes:
  lifeos_db:
  lifeos_minio:
