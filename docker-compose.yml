# Root Docker Compose Stack (SOP §1.3, §3.3, §4.2, §5.5)
services:
  postgres:
    image: postgres:16-alpine
    container_name: pugu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pugu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-pugu}
    expose:
      - '5432'
    volumes:
      - pugu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-pugu} -d $${POSTGRES_DB:-pugu}']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  migration:
    build:
      context: ./server
    command: ['/app/pugu-server', '--run-migrations-only']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pugu:${POSTGRES_PASSWORD:-changeme-dev-password}@postgres:5432/pugu}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  api:
    build:
      context: ./server
    container_name: pugu-api
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0
      PORT: 8788
      SEED: '1'
      DATA_FILE: /data/pugu.json
      DATABASE_URL: ${DATABASE_URL:-postgres://pugu:${POSTGRES_PASSWORD:-changeme-dev-password}@postgres:5432/pugu}
    volumes:
      - pugu_data:/data
    # SOP §1.3: Axum port must never be published to the outside host — internal network only
    expose:
      - '8788'
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile
      additional_contexts:
        huuk: /home/aslpooht/PROJECT/_TEENUENG-COMPANY/components/huuk
    container_name: pugu-web
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: api:8788
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3001}:80'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  pugu_data:
  pugu_postgres_data:
