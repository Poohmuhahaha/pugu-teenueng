# Default values for lifeos Helm chart.
# Override at install with: helm install lifeos . -f my-values.yaml

replicaCount:
  api: 1
  web: 1

image:
  api:
    repository: ghcr.io/lifeos/api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/lifeos/web
    tag: latest
    pullPolicy: IfNotPresent

service:
  api:
    type: ClusterIP
    port: 3000
  web:
    type: ClusterIP
    port: 3001

ingress:
  enabled: false
  className: nginx
  host: lifeos.example.com
  tls: false

postgres:
  # If `external.host` is set, the bundled Postgres stateful set is skipped.
  external:
    host: ''
    port: 5432
    db: lifeos
    user: lifeos
  bundled:
    enabled: true
    storage: 8Gi

secrets:
  jwtSecret: ''       # populate via sealed-secrets or external-secrets
  csrfSecret: ''
  postgresPassword: ''

resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  web:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }

features:
  workspaceSwitcher: true
  cmdK: true
  webhooks: false
  localFirst: false
