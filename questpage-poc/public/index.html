<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestPage Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #f4f4f4; }
    .approved { background-color: #d4edda; }
    button { padding: 5px 10px; cursor: pointer; }
    .controls { margin-bottom: 20px; }
    [contenteditable="true"]:hover { background: #fffde7; outline: 1px dashed #ccc; }
  </style>
</head>
<body>

  <h1>QuestPage Dashboard</h1>
  <div class="controls">
    <button id="refreshBtn">Refresh Data</button>
    <span id="status"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Rows will be injected here -->
    </tbody>
  </table>

  <script>
    const tableBody = document.getElementById('tableBody');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusText = document.getElementById('status');

    async function loadData() {
      try {
        const res = await fetch('/api/prospects');
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTable(data) {
      data.forEach(item => {
        // If row already exists, we skip it so we don't overwrite user's live edits
        if (document.getElementById(`tr-${item.id}`)) {
          return;
        }

        const isApproved = item.status === 'approved';
        const tr = document.createElement('tr');
        tr.id = `tr-${item.id}`;
        if (isApproved) tr.className = 'approved';

        tr.innerHTML = `
          <td>${item.id}</td>
          <td contenteditable="${!isApproved}" id="name-${item.id}">${item.name || ''}</td>
          <td contenteditable="${!isApproved}" id="email-${item.id}">${item.email || ''}</td>
          <td contenteditable="${!isApproved}" id="phone-${item.id}">${item.phone || ''}</td>
          <td id="status-${item.id}">${item.status}</td>
          <td>
            ${!isApproved ? `<button onclick="approve('${item.id}')">Approve</button>` : 'Approved'}
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    async function approve(id) {
      const nameCell = document.getElementById(`name-${id}`).innerText;
      const emailCell = document.getElementById(`email-${id}`).innerText;
      const phoneCell = document.getElementById(`phone-${id}`).innerText;

      try {
        const res = await fetch(`/api/prospects/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: nameCell,
            email: emailCell,
            phone: phoneCell,
            status: 'approved'
          })
        });
        
        if (res.ok) {
          // Diagram: UI->>UI: เปลี่ยนพื้นหลังแถวเป็นสีเขียว
          const tr = document.getElementById(`tr-${id}`);
          tr.className = 'approved';
          document.getElementById(`status-${id}`).innerText = 'approved';
          
          const actionTd = tr.querySelector('td:last-child');
          actionTd.innerHTML = 'Approved';
          
          document.getElementById(`name-${id}`).setAttribute('contenteditable', 'false');
          document.getElementById(`email-${id}`).setAttribute('contenteditable', 'false');
          document.getElementById(`phone-${id}`).setAttribute('contenteditable', 'false');
        } else {
          alert('Failed to approve');
        }
      } catch (err) {
        console.error(err);
        alert('Error approving');
      }
    }

    refreshBtn.addEventListener('click', loadData);

    // Auto-refresh every 3 seconds
    setInterval(loadData, 3000);
    
    // Initial load
    loadData();
  </script>
</body>
</html>
